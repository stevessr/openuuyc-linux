name: Self-host compatibility server
on:
  push:
    paths:
      - 'selfhost/**'
      - '.github/workflows/selfhost.yml'
  pull_request:
    paths:
      - 'selfhost/**'
      - '.github/workflows/selfhost.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r selfhost/requirements.txt
      - run: python -m unittest discover -s selfhost -p 'test_*.py' -v
