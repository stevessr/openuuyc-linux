name: PICO Android OpenXR
on:
  push:
    branches: [linux-port, "feat/pico-vr-*"]
    paths:
      - "pico-android/**"
      - "src/application/viewer/pico_bridge.rs"
      - ".github/workflows/pico-android.yml"
  pull_request:
    paths:
      - "pico-android/**"
      - "src/application/viewer/pico_bridge.rs"
      - ".github/workflows/pico-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: OpenXR APK + Unit Tests (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK, NDK and CMake
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android JVM tests, native compilation and APK
        working-directory: pico-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openuuyc-pico-debug-arm64
          path: pico-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Desktop bridge compile & tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build desktop bridge
        run: cargo check --locked --bin OpenUUYC
      - name: Validate PICO bridge authentication and protocol
        run: cargo test --locked --bin OpenUUYC pico_bridge -- --nocapture
