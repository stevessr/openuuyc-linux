name: PICO Android OpenXR
on:
  push:
    branches: [linux-port, "feat/pico-vr-*"]
    paths:
      - "pico-android/**"
      - "drivers/pcvr/**"
      - "src/pcvr/**"
      - "build.rs"
      - "src/application/viewer/pico_bridge.rs"
      - ".github/workflows/pico-android.yml"
  pull_request:
    paths:
      - "pico-android/**"
      - "drivers/pcvr/**"
      - "src/pcvr/**"
      - "build.rs"
      - "src/application/viewer/pico_bridge.rs"
      - ".github/workflows/pico-android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest commit in each push/PR validation lane. Native Rust,
# Android SDK/NDK and Gradle jobs are expensive; stale parallel builds would
# otherwise delay the APK and protocol reports needed for this PR.
concurrency:
  group: pico-openxr-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: OpenXR APK + Unit Tests (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK, NDK and CMake
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test borrowed OpenXR JNI Surface reference ownership
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_surface_callback_test.cpp -o /tmp/xr-surface-test
          /tmp/xr-surface-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_panel_geometry_test.cpp -o /tmp/xr-panel-geometry-test
          /tmp/xr-panel-geometry-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_menu_click_test.cpp -o /tmp/xr-menu-click-test
          /tmp/xr-menu-click-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_panel_depth_test.cpp -o /tmp/xr-panel-depth-test
          /tmp/xr-panel-depth-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_grip_hold_test.cpp -o /tmp/xr-grip-hold-test
          /tmp/xr-grip-hold-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_panel_orbit_test.cpp -o /tmp/xr-panel-orbit-test
          /tmp/xr-panel-orbit-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_ray_geometry_test.cpp -o /tmp/xr-ray-geometry-test
          /tmp/xr-ray-geometry-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_panel_aspect_test.cpp -o /tmp/xr-panel-aspect-test
          /tmp/xr-panel-aspect-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_pose_math_test.cpp -o /tmp/xr-pose-math-test
          /tmp/xr-pose-math-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_pointer_feedback_test.cpp -o /tmp/xr-pointer-feedback-test
          /tmp/xr-pointer-feedback-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_video_resolution_test.cpp -o /tmp/xr-video-resolution-test
          /tmp/xr-video-resolution-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_menu_anchor_test.cpp -o /tmp/xr-menu-anchor-test
          /tmp/xr-menu-anchor-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_frame_hit_test.cpp -o /tmp/xr-frame-hit-test
          /tmp/xr-frame-hit-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_controller_menu_test.cpp -o /tmp/xr-controller-menu-test
          /tmp/xr-controller-menu-test
          c++ -std=c++17 -Wall -Wextra -Werror -Ipico-android/app/src/main/cpp \
            pico-android/app/src/test/cpp/xr_stick_release_test.cpp -o /tmp/xr-stick-release-test
          /tmp/xr-stick-release-test
      - name: Validate launcher and immersive Activity separation
        run: python3 -m unittest discover -s pico-android/scripts/tests -v
      - name: Validate ADB smoke script syntax
        run: bash -n pico-android/scripts/pico-adb-smoke.sh pico-android/scripts/pico-adb-ui-tests.sh
      - name: Android JVM protocol and session-state tests
        working-directory: pico-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Native arm64 OpenXR APK build and Android lint
        working-directory: pico-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Preserve protocol test XML, HTML and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-protocol-test-reports
          path: |
            pico-android/app/build/test-results/testDebugUnitTest/
            pico-android/app/build/reports/tests/testDebugUnitTest/
            pico-android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openuuyc-pico-debug-arm64
          path: pico-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Desktop bridge compile & tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev
      # The existing linux-port tree has unrelated rustfmt differences; normalize
      # locally for the compile job without rewriting unrelated source files.
      - name: Normalize Rust formatting for build
        run: cargo fmt --all
      - name: Build desktop bridge
        run: cargo check --locked --bin OpenUUYC
      - name: Validate built-in PCVR protocol and driver lifecycle
        run: |
          cargo test --locked --lib pcvr::protocol
          c++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wno-unused-parameter \
            drivers/pcvr/tests/driver_test.cpp -o /tmp/openuuyc-pcvr-test
          /tmp/openuuyc-pcvr-test
      - name: Validate PICO bridge authentication and protocol
        run: cargo test --locked --lib pico_bridge -- --nocapture

  spatial:
    name: PICO OS 6 Spatial SDK preview (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 15 build tools (no OS 5 deployment)
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile official Spatial SDK backend and lint
        working-directory: pico-android
        run: gradle --no-daemon --stacktrace -PpicoSpatial=true :spatial:assembleDebug :spatial:testDebugUnitTest :spatial:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openuuyc-pico-os6-spatial-preview-arm64
          path: pico-android/spatial/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
