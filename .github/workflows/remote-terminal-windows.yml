name: UU remote terminal Windows compatibility

on:
  pull_request:
    paths:
      - 'src/session/controller/**'
      - 'src/session/negotiation.rs'
      - 'src/transport/rtc/**'
      - 'src/main.rs'
      - 'src/application/app/view/device_details.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/remote-terminal-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uu-remote-terminal-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install native assembler
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Check official terminal controller CLI and Windows viewer
        run: cargo check --locked --bin OpenUUYC

      - name: Test TERM v1 frame parsing and controller behavior
        run: cargo test --locked --lib session::controller::terminal::tests
