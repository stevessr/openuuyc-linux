name: Self-host Rust server
on:
  push:
    paths:
      - 'selfhost-rs/**'
      - '.github/workflows/selfhost-rs.yml'
  pull_request:
    paths:
      - 'selfhost-rs/**'
      - '.github/workflows/selfhost-rs.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path selfhost-rs/Cargo.toml
      - name: Build image
        run: docker build -t openuuyc-selfhost:ci selfhost-rs
