name: Private window control

on:
  push:
    branches: [feat/private-window-control-niri-win]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native assembler when needed
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Check Windows host and viewer code
        run: cargo check --locked --lib
      - name: Unit-test private window protocol
        run: cargo test --locked --lib window_control
