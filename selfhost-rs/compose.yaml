# Distributed demo: one Redis + two nodes. Put a real LB and HTTPS in front
# for production. Both nodes share all state through Redis; any client can
# connect to either node.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  node-a:
    build: .
    image: openuuyc-selfhost:local
    restart: unless-stopped
    depends_on: [redis]
    environment:
      OPENUUYC_PUBLIC_URL: "${OPENUUYC_PUBLIC_URL:?Set a public HTTPS origin}"
      OPENUUYC_ADMIN_KEY: "${OPENUUYC_ADMIN_KEY:?Set a strong random administrator key}"
      OPENUUYC_ICE_SERVERS: "${OPENUUYC_ICE_SERVERS:?Set at least one STUN/TURN URI}"
      OPENUUYC_REDIS_URL: redis://redis:6379
      OPENUUYC_NODE_ID: node-a
      OPENUUYC_DATA_DIR: /data
    ports:
      - "127.0.0.1:8844:8844"
    volumes:
      - node-a-data:/data

  node-b:
    build: .
    image: openuuyc-selfhost:local
    restart: unless-stopped
    depends_on: [redis]
    environment:
      OPENUUYC_PUBLIC_URL: "${OPENUUYC_PUBLIC_URL:?Set a public HTTPS origin}"
      OPENUUYC_ADMIN_KEY: "${OPENUUYC_ADMIN_KEY:?Set a strong random administrator key}"
      OPENUUYC_ICE_SERVERS: "${OPENUUYC_ICE_SERVERS:?Set at least one STUN/TURN URI}"
      OPENUUYC_REDIS_URL: redis://redis:6379
      OPENUUYC_NODE_ID: node-b
      OPENUUYC_DATA_DIR: /data
    ports:
      - "127.0.0.1:8845:8844"
    volumes:
      - node-b-data:/data

volumes:
  redis-data:
  node-a-data:
  node-b-data:
