# OpenUUYC self-host deployment.
#
# Profiles:
#   (default)        redis + node-a + node-b
#   keycloak         adds a Keycloak IdP for enrollment login
#   proxy            adds Caddy with automatic HTTPS for the public domain
#
# Copy .env.example to .env (deploy.sh does this) and fill in the values.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-a:
    build: .
    image: openuuyc-selfhost:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: &node-env
      OPENUUYC_PUBLIC_URL: "$${OPENUUYC_PUBLIC_URL:?Set a public HTTPS origin}"
      OPENUUYC_ADMIN_KEY: "$${OPENUUYC_ADMIN_KEY:?Set a strong random administrator key}"
      OPENUUYC_ICE_SERVERS: "$${OPENUUYC_ICE_SERVERS:?Set at least one STUN/TURN URI}"
      OPENUUYC_REDIS_URL: redis://redis:6379
      OPENUUYC_NODE_ID: node-a
      OPENUUYC_DATA_DIR: /data
      OPENUUYC_OIDC_ISSUER: "$${OPENUUYC_OIDC_ISSUER:-}"
      OPENUUYC_OIDC_CLIENT_ID: "$${OPENUUYC_OIDC_CLIENT_ID:-}"
      OPENUUYC_OIDC_CLIENT_SECRET: "$${OPENUUYC_OIDC_CLIENT_SECRET:-}"
      OPENUUYC_OIDC_REQUIRE: "$${OPENUUYC_OIDC_REQUIRE:-0}"
    ports:
      - "127.0.0.1:8844:8844"
    volumes:
      - node-a-data:/data

  node-b:
    build: .
    image: openuuyc-selfhost:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *node-env
      OPENUUYC_NODE_ID: node-b
    ports:
      - "127.0.0.1:8845:8844"
    volumes:
      - node-b-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: "$${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "$${KEYCLOAK_ADMIN_PASSWORD:?Required with the keycloak profile}"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/openuuyc-realm.json:/opt/keycloak/data/import/openuuyc-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [node-a, node-b]
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENUUYC_PUBLIC_HOST: "$${OPENUUYC_PUBLIC_HOST:?Required with the proxy profile}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  node-a-data:
  node-b-data:
  caddy-data:
  caddy-config:
