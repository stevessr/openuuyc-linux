services:
  openuuyc-selfhost:
    build: .
    restart: unless-stopped
    environment:
      OPENUUYC_PUBLIC_URL: ${OPENUUYC_PUBLIC_URL:?Set a public HTTPS origin}
      OPENUUYC_ADMIN_KEY: ${OPENUUYC_ADMIN_KEY:?Set a strong random administrator key}
      OPENUUYC_ICE_SERVERS: ${OPENUUYC_ICE_SERVERS:?Set at least one STUN/TURN URI}
      OPENUUYC_TURN_SECRET: ${OPENUUYC_TURN_SECRET:-}
      OPENUUYC_TURN_USER: ${OPENUUYC_TURN_USER:-}
      OPENUUYC_TURN_PASSWORD: ${OPENUUYC_TURN_PASSWORD:-}
    ports:
      - "127.0.0.1:8844:8844"
    volumes:
      - openuuyc-state:/data
volumes:
  openuuyc-state:
